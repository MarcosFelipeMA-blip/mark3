<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canais em T em AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Visual único e deliberado: chão de fábrica claro com o laranja da demonstração. */
  :root {
    color-scheme: light;
    --paper: #e9ecef; --paper-2: #d3d8dd; --panel: rgba(250, 251, 252, 0.92);
    --ink: #17202a; --ink-2: #33404c; --muted: #5d6a76; --line: rgba(23, 32, 42, 0.14);
    --accent: #d94f25;
    --display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --body: "Barlow", "Helvetica Neue", Arial, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; color: var(--ink); font: 400 15px/1.5 var(--body);
    background: radial-gradient(120% 90% at 50% 35%, #f4f6f7 0%, var(--paper) 55%, var(--paper-2) 100%) fixed, var(--paper); }
  model-viewer { position: fixed; inset: 0; width: 100%; height: 100%; --poster-color: transparent; background: transparent; }
  .top { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 16px; right: 16px; pointer-events: none; }
  .eyebrow { margin: 0; font: 500 11px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 3px 0 0; font: 700 34px/0.95 var(--display); text-transform: uppercase; text-wrap: balance; }
  h1 span { color: var(--accent); }
  .sub { margin: 4px 0 0; color: var(--ink-2); }
  .credit { margin: 6px 0 0; font: 500 10px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .credit b { color: var(--ink); font-weight: 500; }
  .bottom { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: grid; gap: 10px; justify-items: center; }
  #arBtn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border: 0; border-radius: 4px;
    background: var(--accent); color: #fff; font: 600 17px/1 var(--body); cursor: pointer; box-shadow: 0 6px 18px rgba(217, 79, 37, .3); }
  #arBtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  #arBtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .note { max-width: 560px; margin: 0; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    font-size: 13px; color: var(--ink-2); text-align: center; text-wrap: pretty; }
  .note b { color: var(--ink); }
  #status { font: 500 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  @media (min-width: 900px) { h1 { font-size: 44px; } }
</style>
</head>
<body>

<model-viewer id="mv" src="canais-T.glb" ios-src="canais-T.usdz" alt="Anel com 9 canais em T, em corte, com as ferramentas de canal entrando no canal 5"
  ar ar-modes="scene-viewer webxr quick-look" ar-scale="auto" ar-placement="floor"
  camera-controls touch-action="pan-y" autoplay animation-name="Usinagem"
  camera-orbit="35deg 68deg 2.9m" camera-target="0.1m 0.2m 0m" min-camera-orbit="auto auto 0.12m" field-of-view="30deg"
  shadow-intensity="0.8" exposure="1.05" environment-image="neutral">
  <button slot="ar-button" id="arBtn" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
    Ver na minha sala (AR)
  </button>
</model-viewer>

<header class="top">
  <p class="eyebrow">Torno vertical Mazak · ferramentas Sandvik Coromant</p>
  <h1>Canais em T <span>em AR</span></h1>
  <p class="sub">Anel Ø1173 em tamanho real · 9 canais · 4 ferramentas</p>
  <p class="credit">Projeto <b>Marcos Felipe</b></p>
</header>

<div class="bottom">
  <p class="note" id="note">Arraste para girar e use dois dedos para aproximar. As quatro ferramentas entram no canal 5 em sequência.</p>
  <span id="status">Carregando modelo…</span>
</div>

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script>
  const mv = document.getElementById('mv'), status = document.getElementById('status'), note = document.getElementById('note');
  mv.addEventListener('load', () => {
    status.textContent = 'Modelo carregado';
    if (mv.canActivateAR) {
      document.getElementById('arBtn').hidden = false;
      note.innerHTML = 'Toque em <b>Ver na minha sala</b> e aponte o celular para o chão. O anel aparece em tamanho real; use dois dedos para diminuir.';
    } else {
      note.innerHTML = 'Este aparelho não abre a realidade aumentada por aqui. No iPhone, abra o arquivo <b>canais-T.usdz</b>; no Android, use o arquivo <b>canais-T.glb</b>.';
    }
  });
  mv.addEventListener('error', () => { status.textContent = 'Não foi possível carregar o modelo'; });
  mv.addEventListener('ar-status', e => {
    if (e.detail.status === 'failed') note.innerHTML = 'A realidade aumentada não abriu neste aparelho. Use os arquivos <b>canais-T.usdz</b> (iPhone) ou <b>canais-T.glb</b> (Android).';
  });
</script>
</body>
</html>
