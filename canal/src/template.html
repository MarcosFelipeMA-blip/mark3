<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canais em T no torno vertical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Visual único e deliberado: chão de fábrica claro, prancheta técnica, destaque laranja. */
  :root {
    color-scheme: light;
    --paper: #e9ecef; --paper-2: #d3d8dd; --panel: rgba(250, 251, 252, 0.9); --panel-solid: #fafbfc;
    --ink: #17202a; --ink-2: #33404c; --muted: #5d6a76; --line: rgba(23, 32, 42, 0.14); --line-strong: rgba(23, 32, 42, 0.32);
    --accent: #d94f25; --blue: #0b6bcb;
    --display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --body: "Barlow", "Helvetica Neue", Arial, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --gutter: 16px; --tb: 60px;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; color: var(--ink); font: 400 14px/1.5 var(--body); -webkit-font-smoothing: antialiased;
    background: radial-gradient(120% 90% at 40% 35%, #f4f6f7 0%, var(--paper) 55%, var(--paper-2) 100%) fixed, var(--paper); }
  #app { position: fixed; inset: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .brand { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); left: calc(var(--gutter) + 4px); pointer-events: none; max-width: min(560px, calc(100% - 380px)); }
  .eyebrow { margin: 0; font: 500 11px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .brand h1 { margin: 3px 0 0; font: 700 40px/0.95 var(--display); text-transform: uppercase; text-wrap: balance; }
  .brand h1 span { color: var(--accent); }
  .brand .sub { margin: 4px 0 0; font-size: 15px; color: var(--ink-2); }
  #caption { position: absolute; left: calc(var(--gutter) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tb) + 30px); margin: 0;
    font: 700 24px/1.1 var(--display); max-width: min(620px, calc(100% - 380px)); text-wrap: balance; }
  #credit { position: absolute; right: calc(var(--gutter) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tb) + 30px); margin: 0;
    font: 500 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
  #credit b { color: var(--ink); font-weight: 500; }
  #panel { position: absolute; right: var(--gutter); top: calc(env(safe-area-inset-top, 0px) + 16px); width: 332px;
    max-height: calc(100% - 16px - var(--tb) - 60px); overflow-y: auto; padding: 15px 17px 17px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #panel h2 { margin: 4px 0 8px; font: 700 28px/1 var(--display); text-transform: uppercase; text-wrap: balance; }
  #panel p.text { margin: 0 0 12px; color: var(--ink-2); text-wrap: pretty; }
  .facts { margin: 0 0 14px; display: grid; grid-template-columns: auto 1fr; border-top: 1px solid var(--line); }
  .facts dt, .facts dd { margin: 0; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .facts dt { font: 500 11px/1.5 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding-right: 12px; }
  .facts dd { text-align: right; font: 500 12.5px/1.4 var(--mono); }
  .ops { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .ops li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 7px 8px; border-radius: 3px; color: var(--muted); }
  .ops li .n { font: 500 11px/1.6 var(--mono); }
  .ops li b { display: block; font-weight: 600; }
  .ops li small { display: block; font: 400 11px/1.35 var(--mono); }
  .ops li.on { background: rgba(217, 79, 37, .12); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
  .ops li.done { color: var(--ink-2); }
  #toolbar { position: absolute; left: var(--gutter); right: var(--gutter); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px; padding: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .grp { display: inline-flex; align-items: center; gap: 6px; }
  .grp > small { font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .btn, .seg button { min-height: 34px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 3px; background: rgba(255,255,255,.75); color: var(--ink); font: 500 13px/1 var(--body); cursor: pointer; white-space: nowrap; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 3px; overflow: hidden; }
  .seg button { border: 0; border-left: 1px solid var(--line); border-radius: 0; min-height: 32px; font-size: 12.5px; }
  .seg button:first-child { border-left: 0; }
  .btn[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn:focus-visible, .seg button:focus-visible, #play:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #play { width: 44px; height: 36px; border: 0; border-radius: 3px; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; }
  #play svg { width: 18px; height: 18px; fill: currentColor; }
  .progress { position: relative; width: 170px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  #bar { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); }
  #groove { font: 500 12px/1 var(--mono); color: var(--muted); min-width: 78px; }
  .legend { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .legend i { width: 18px; border-top: 2px dashed var(--blue); display: inline-block; }
  @media (max-width: 1100px) { #panel { width: 290px; } .brand h1 { font-size: 32px; } }
  @media (max-width: 860px) {
    .brand { max-width: calc(100% - 2 * var(--gutter)); }
    .brand h1 { font-size: 26px; }
    .brand .sub { font-size: 13px; }
    #panel { top: auto; left: var(--gutter); right: var(--gutter); width: auto; max-height: 30%; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tb) + 24px); }
    #panel h2 { font-size: 22px; }
    #caption { top: calc(env(safe-area-inset-top, 0px) + 120px); bottom: auto; font-size: 17px; max-width: none; right: var(--gutter); }
    #credit { top: calc(env(safe-area-inset-top, 0px) + 98px); bottom: auto; left: calc(var(--gutter) + 4px); right: auto; font-size: 9px; }
    #toolbar { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; gap: 8px; padding: 6px; }
    #toolbar::-webkit-scrollbar { display: none; }
    .grp, .progress { flex: none; } .grp > small { display: none; } .progress { width: 90px; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="Simulação 3D da usinagem de 9 canais em T no diâmetro interno de um anel, num torno vertical"></canvas>
  <div id="loading">Preparando a simulação…</div>
  <header class="brand">
    <p class="eyebrow">Torno vertical Mazak · ferramentas Sandvik Coromant</p>
    <h1>Canais em T <span>no Ø interno</span></h1>
    <p class="sub">Anel porta-palhetas · Ø684,5 · 9 canais · 4 ferramentas</p>
  </header>
  <p id="caption" aria-live="polite"></p>
  <p id="credit">Projeto <b>Marcos Felipe</b></p>
  <aside id="panel" aria-live="polite"></aside>
  <nav id="toolbar" aria-label="Controles">
    <div class="grp">
      <button id="play" type="button" aria-label="Pausar"></button>
      <button class="btn" id="restart" type="button">Reiniciar</button>
      <div class="progress" aria-hidden="true"><div id="bar"></div></div>
      <span id="groove">—</span>
    </div>
    <div class="grp"><small>Velocidade</small>
      <div class="seg" role="group" aria-label="Velocidade">
        <button type="button" data-speed="1" aria-pressed="true">1×</button><button type="button" data-speed="2">2×</button><button type="button" data-speed="4">4×</button>
      </div>
    </div>
    <div class="grp"><small>Câmera</small>
      <div class="seg" role="group" aria-label="Câmera">
        <button type="button" data-view="auto">Automática</button><button type="button" data-view="geral">Geral</button><button type="button" data-view="detalhe">Canal</button><button type="button" data-view="perfil">Perfil 2D</button>
      </div>
    </div>
    <button class="btn" id="bTarget" type="button" aria-pressed="true"><span class="legend"><i></i>Perfil do desenho</span></button>
  </nav>
</div>
<script>/*APP*/</script>
</body>
</html>
