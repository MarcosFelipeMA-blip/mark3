<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fresa MS20-R016A16-10L</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Visual único e deliberado: estúdio fotográfico claro, como foto de catálogo. */
  :root {
    color-scheme: light;
    --studio-1: #f1f2f3;
    --studio-2: #cfd3d7;
    --ink: #121416;
    --ink-2: #2b3035;
    --muted: #5b646c;
    --line: rgba(18, 20, 22, 0.14);
    --line-strong: rgba(18, 20, 22, 0.3);
    --panel: rgba(250, 251, 251, 0.84);
    --panel-solid: #fafbfb;
    --gold: #c8962a;
    --gold-ink: #7a5712;
    --cool: #1f78c8;
    --dark: #16181a;
    --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --gutter: 16px;
    --panel-w: 340px;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(110% 80% at 42% 35%, var(--studio-1) 0%, #e3e6e8 45%, var(--studio-2) 100%) fixed, var(--studio-1);
    color: var(--ink);
    font: 400 14px/1.5 var(--body);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .brand {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 18px);
    left: calc(var(--gutter) + 8px);
    pointer-events: none;
    max-width: min(520px, calc(100% - var(--panel-w) - 64px));
  }
  .eyebrow {
    margin: 0;
    font: 500 11px/1.4 var(--mono);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .brand h1 {
    margin: 4px 0 2px;
    font: 800 46px/0.92 var(--display);
    font-stretch: 68%;
    letter-spacing: 0.005em;
    text-transform: uppercase;
  }
  .brand h1 span { color: var(--gold-ink); }
  .partners {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
    margin: 0 0 10px;
    font: 700 15px/1.2 var(--display); font-stretch: 85%; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .partners .sep { width: 1px; height: 16px; background: var(--line-strong); }
  .partners small {
    font: 500 10px/1.2 var(--mono); letter-spacing: 0.08em; color: var(--gold-ink);
    padding: 3px 6px; border: 1px solid var(--gold); border-radius: 99px;
  }
  #credit {
    position: absolute; margin: 0;
    right: calc(var(--gutter) + var(--panel-w) + 16px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
    font: 500 11px/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    pointer-events: none;
  }
  #credit b { color: var(--ink); font-weight: 500; }
  .brand p.sub { margin: 4px 0 0; font-size: 15px; color: var(--ink-2); }

  /* Painel do capítulo */
  #panel {
    position: absolute;
    right: var(--gutter);
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 88px);
    width: var(--panel-w);
    overflow-y: auto;
    padding: 18px 20px 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  #panel h2 {
    margin: 6px 0 8px;
    font: 800 30px/1 var(--display);
    font-stretch: 72%;
    text-transform: uppercase;
    text-wrap: balance;
  }
  #panel p.text { margin: 0 0 14px; color: var(--ink-2); text-wrap: pretty; }
  #panel h3 {
    margin: 18px 0 6px;
    font: 500 11px/1.4 var(--mono);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .specs { margin: 0; display: grid; grid-template-columns: 1fr auto; border-top: 1px solid var(--line); }
  .specs dt, .specs dd { margin: 0; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .specs dt { color: var(--ink-2); }
  .specs dt small { font: 500 10px/1 var(--mono); color: var(--muted); letter-spacing: 0.06em; margin-left: 6px; }
  .specs dd { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .code {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin: 4px 0 0;
    padding: 0; list-style: none;
  }
  .code li {
    display: grid; gap: 2px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.55);
    min-width: 0;
  }
  .code b { font: 600 15px/1 var(--mono); }
  .code span { font-size: 11px; line-height: 1.25; color: var(--muted); }
  .drawing { color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 6px; }
  .drawing svg { display: block; width: 100%; height: auto; }
  .note { margin: 14px 0 0; font-size: 11.5px; line-height: 1.45; color: var(--muted); }
  .parts { list-style: none; margin: 0; padding: 0; display: grid; }
  .parts li {
    display: grid; grid-template-columns: 26px 1fr; gap: 2px 10px;
    padding: 9px 0; border-bottom: 1px solid var(--line);
  }
  .parts li:first-child { border-top: 1px solid var(--line); }
  .parts .n {
    grid-row: span 2;
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--ink); display: grid; place-items: center;
    font: 600 11px/1 var(--mono);
  }
  .parts .n.dim { border-style: dashed; border-color: var(--muted); color: var(--muted); }
  .parts b { font-weight: 600; }
  .parts code { font: 500 12px/1.4 var(--mono); color: var(--ink-2); }
  .pill { white-space: nowrap; font: 500 10px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 6px; border-radius: 99px; border: 1px solid currentColor; margin-left: 6px; vertical-align: 1px; }
  .pill.in { color: #2d7a3c; }
  .pill.out { color: #9a5b12; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: s; }
  .steps li {
    counter-increment: s;
    display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;
    padding: 8px 8px; border-radius: 3px; color: var(--muted);
    transition: background-color .25s, color .25s;
  }
  .steps li::before { content: counter(s, decimal-leading-zero); font: 500 11px/1.6 var(--mono); }
  .steps li.on { background: rgba(200, 150, 42, 0.16); color: var(--ink); }
  .steps li.done { color: var(--ink-2); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button.btn {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 34px; padding: 0 12px;
    border: 1px solid var(--line-strong); border-radius: 3px;
    background: rgba(255, 255, 255, 0.6); color: var(--ink);
    font: 500 13px/1 var(--body); cursor: pointer; white-space: nowrap;
  }
  button.btn:hover { background: #fff; }
  button.btn:focus-visible, .chap:focus-visible, #play:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button.btn[aria-pressed="true"] { background: var(--dark); border-color: var(--dark); color: #fff; }
  button.btn.primary { background: var(--dark); border-color: var(--dark); color: #fff; }
  .range { display: grid; gap: 6px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .range input { width: 100%; accent-color: var(--gold); }
  .data { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .data div { background: var(--panel-solid); padding: 8px 10px; }
  .data small { display: block; font: 500 10px/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .data b { font: 700 22px/1.1 var(--display); font-stretch: 80%; font-variant-numeric: tabular-nums; }
  .data b i { font-style: normal; font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 3px; font-family: var(--body); }

  /* Linha do tempo */
  #timeline {
    position: absolute;
    left: var(--gutter);
    right: var(--gutter);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex;
    align-items: stretch;
    gap: 8px;
  }
  #play {
    flex: none; width: 56px;
    border: 0; border-radius: 3px;
    background: var(--dark); color: #fff;
    display: grid; place-items: center; cursor: pointer;
  }
  #play svg { width: 18px; height: 18px; fill: currentColor; }
  #chapters { list-style: none; margin: 0; padding: 0; flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .chap {
    width: 100%; height: 100%;
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 10px;
    padding: 9px 12px 11px;
    border: 1px solid var(--line); border-radius: 3px;
    background: var(--panel); color: var(--muted);
    font: 500 13px/1.2 var(--body); text-align: left; cursor: pointer; position: relative; overflow: hidden;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .chap .n { font: 500 11px/1 var(--mono); }
  .chap .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chap .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: transparent; }
  .chap .bar b { display: block; height: 100%; width: 0; background: var(--gold); }
  .chap.on { color: var(--ink); border-color: var(--line-strong); background: var(--panel-solid); }
  .chap.on .nm { font-weight: 600; }

  #caption {
    position: absolute;
    left: calc(var(--gutter) + 8px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
    max-width: min(560px, calc(100% - var(--panel-w) - 64px));
    font: 700 26px/1.1 var(--display);
    font-stretch: 78%;
    text-wrap: balance;
    transition: opacity .35s;
  }
  #caption small { display: block; margin-bottom: 6px; font: 500 11px/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-ink); }

  /* Chamadas 3D */
  #leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #leaders line { stroke: var(--ink); stroke-width: 1; }
  #leaders circle { fill: var(--panel-solid); stroke: var(--ink); stroke-width: 1.5; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .lbl {
    position: absolute; left: 0; top: 0;
    padding: 5px 8px 6px;
    background: var(--panel-solid);
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    font: 500 12px/1.25 var(--body);
    white-space: nowrap;
    opacity: 0;
    transition: opacity .35s;
    will-change: transform;
  }
  .lbl.show { opacity: 1; }
  .lbl b { display: block; font: 600 13px/1.2 var(--body); }
  .lbl code { font: 500 11px/1.3 var(--mono); color: var(--muted); }
  .lbl.dim { background: transparent; border: 0; padding: 0 4px; font: 600 13px/1 var(--mono); }
  .lbl.cool { border-color: var(--cool); color: var(--cool); }
  #tip {
    position: absolute; pointer-events: none;
    padding: 5px 9px; background: var(--dark); color: #fff; border-radius: 3px;
    font: 500 12px/1.2 var(--body); white-space: nowrap; transform: translate(14px, 14px);
  }
  #flash {
    position: absolute; left: 50%; top: 40%;
    transform: translate(-50%, -50%);
    padding: 10px 16px; background: var(--dark); color: #fff; border-radius: 3px;
    font: 700 18px/1 var(--display); font-stretch: 80%; letter-spacing: 0.04em; text-transform: uppercase;
    pointer-events: none;
  }

  @media (max-width: 1100px) { :root { --panel-w: 300px; } .brand h1 { font-size: 38px; } }
  @media (max-width: 820px) {
    .brand h1 { font-size: 30px; }
    .partners {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
    margin: 0 0 10px;
    font: 700 15px/1.2 var(--display); font-stretch: 85%; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .partners .sep { width: 1px; height: 16px; background: var(--line-strong); }
  .partners small {
    font: 500 10px/1.2 var(--mono); letter-spacing: 0.08em; color: var(--gold-ink);
    padding: 3px 6px; border: 1px solid var(--gold); border-radius: 99px;
  }
  #credit {
    position: absolute; margin: 0;
    right: calc(var(--gutter) + var(--panel-w) + 16px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
    font: 500 11px/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    pointer-events: none;
  }
  #credit b { color: var(--ink); font-weight: 500; }
  .brand p.sub { font-size: 13px; }
    .brand { max-width: calc(100% - 2 * var(--gutter)); }
    #panel {
      top: auto; left: var(--gutter); right: var(--gutter);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 76px);
      width: auto; max-height: 34%;
      padding: 12px 14px 14px;
    }
    #panel h2 { font-size: 22px; }
    #chapters { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .chap { grid-template-columns: 1fr; padding: 8px 6px 10px; justify-items: center; }
    .chap .nm { display: none; }
    .chap.on .nm { display: none; }
    #play { width: 48px; }
    #caption {
      left: var(--gutter); right: var(--gutter); max-width: none;
      top: calc(env(safe-area-inset-top, 0px) + 146px); bottom: auto;
      font-size: 18px;
    }
    .lbl { font-size: 11px; padding: 3px 6px 4px; }
    .lbl b { font-size: 11.5px; }
    .lbl.minor { display: none; }
    #flash { font-size: 14px; white-space: nowrap; }
    .partners { font-size: 12px; margin-bottom: 6px; }
    #credit { left: var(--gutter); right: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 58px); font-size: 9px; }
    #caption small { display: none; }
  }
  .capture .lbl, .capture #caption, .capture .steps li { transition: none; }
  @media (prefers-reduced-motion: reduce) {
    .lbl, #caption, .steps li { transition: none; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="Modelo 3D da fresa MS20-R016A16-10L"></canvas>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="labels" aria-hidden="true"></div>

  <header class="brand">
    <p class="partners"><b>Sandvik Coromant</b><span class="sep" aria-hidden="true"></span><b>i9 Ferramentas</b><small>distribuidor autorizado</small></p>
    <p class="eyebrow">CoroMill® MS20</p>
    <h1>MS20-R016A16-<span>10L</span></h1>
    <p class="sub">Fresa de topo para rebaixo a 90°</p>
  </header>
  <p id="credit">Projeto <b>Marcos Felipe</b></p>

  <div id="caption" aria-live="polite"></div>
  <aside id="panel" aria-live="polite"></aside>

  <nav id="timeline" aria-label="Capítulos da apresentação">
    <button id="play" type="button" aria-label="Pausar"></button>
    <ol id="chapters"></ol>
  </nav>

  <div id="tip" hidden></div>
  <div id="flash" hidden></div>
</div>

<template id="drawing-src"><!--DRAWING--></template>

<script>/*MESH*/</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const TAU = Math.PI * 2;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ---------- Renderizador ---------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.03).texture;

const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
keyLight.position.set(110, 230, 150);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
Object.assign(keyLight.shadow.camera, { left: -140, right: 140, top: 140, bottom: -140, near: 20, far: 700 });
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.4;
scene.add(keyLight);
scene.add(new THREE.HemisphereLight(0xffffff, 0xaeb4ba, 0.5));
const rimLight = new THREE.DirectionalLight(0xdfe8ff, 1.1);
rimLight.position.set(-160, 80, -140);
scene.add(rimLight);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.position.y = -26;
ground.receiveShadow = true;
scene.add(ground);

const camera = new THREE.PerspectiveCamera(30, 1, 1, 5000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 25;
controls.maxDistance = 900;

function isNarrow() { return innerWidth <= 820; }
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  // desloca o centro óptico para a área que o painel deixa livre
  const w = innerWidth, h = innerHeight, r = $('panel').getBoundingClientRect();
  let dx = 0, dy = 0;
  if (isNarrow()) dy = h / 2 - (170 + r.top) / 2;
  else dx = (r.width + 16) / 2;
  camera.setViewOffset(w, h, dx, dy, w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ---------- Malhas do arquivo STEP ---------- */
const STEP_TO_WORLD = new THREE.Matrix4().makeTranslation(0, 100, 0).multiply(new THREE.Matrix4().makeRotationX(-Math.PI / 2));
function decodeMesh(d) {
  const buf = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
  const q = new Int16Array(buf(d.p)), n = new Int8Array(buf(d.n));
  const idx = d.i32 ? new Uint32Array(buf(d.i)) : new Uint16Array(buf(d.i));
  const pos = new Float32Array(q.length), nor = new Float32Array(n.length);
  for (let k = 0; k < q.length; k++) {
    const j = k % 3;
    pos[k] = d.mn[j] + ((q[k] + 32768) / 65535) * (d.mx[j] - d.mn[j]);
    nor[k] = n[k] / 127;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.applyMatrix4(STEP_TO_WORLD);
  g.normalizeNormals();
  return g;
}

/* ---------- Materiais ---------- */
const MAT = {
  body: new THREE.MeshPhysicalMaterial({ color: 0x1b1d20, metalness: 0.55, roughness: 0.36, clearcoat: 0.35, clearcoatRoughness: 0.35 }),
  insert: new THREE.MeshPhysicalMaterial({ color: 0xd9ab45, metalness: 1, roughness: 0.27, clearcoat: 0.2 }),
  screw: new THREE.MeshStandardMaterial({ color: 0x3b3f44, metalness: 1, roughness: 0.32 }),
  recess: new THREE.MeshStandardMaterial({ color: 0x0c0d0e, metalness: 0.6, roughness: 0.6, side: THREE.DoubleSide }),
  bit: new THREE.MeshStandardMaterial({ color: 0xa4aab0, metalness: 1, roughness: 0.22 }),
  yellow: new THREE.MeshPhysicalMaterial({ color: 0xf1bf12, metalness: 0, roughness: 0.42, clearcoat: 0.6, clearcoatRoughness: 0.25 }),
  grip: new THREE.MeshStandardMaterial({ color: 0x17181a, metalness: 0, roughness: 0.78 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xd6d9dc, metalness: 1, roughness: 0.12 }),
  holder: new THREE.MeshStandardMaterial({ color: 0xb3b8bd, metalness: 1, roughness: 0.28 }),
  coolant: new THREE.MeshBasicMaterial({ color: 0x2b8ce0, transparent: true, opacity: 0, depthWrite: false }),
};
MAT.body.transparent = false;

/* ---------- Ferramenta ---------- */
const M = window.MS20_MESH;
const tool = new THREE.Group();
scene.add(tool);

const body = new THREE.Mesh(decodeMesh(M.body), MAT.body);
body.castShadow = true; body.receiveShadow = true;
tool.add(body);

// Pastilhas: dados do furo do parafuso medidos no STEP (centro e eixo em coordenadas do mundo)
const SEATS = {
  B: { c: V(4.288, 5.063, -1.152), a: V(0.288, 0.105, 0.952).normalize(), mesh: M.insB },
  A: { c: V(-4.288, 5.063, 1.152), a: V(-0.288, 0.105, -0.952).normalize(), mesh: M.insA },

/* ---------- Câmera por capítulo ---------- */
const desired = { pos: V(0, 0, 0), target: V(0, 0, 0) };
function orbit(target, az, el, dist) {
  const f = isNarrow() ? 2.2 : 1;
  desired.target.copy(target);
  desired.pos.set(target.x + Math.sin(az) * Math.cos(el) * dist * f, target.y + Math.sin(el) * dist * f, target.z + Math.cos(az) * Math.cos(el) * dist * f);
}
function chainView(center, dist, lift, along) {
  const a = SEATS.B.a, side = V(a.z, 0, -a.x).normalize();
  const f = isNarrow() ? 1.9 : 1;
  desired.target.copy(center);
  desired.pos.copy(center).addScaledVector(side, dist * f).add(V(0, lift * f, 0)).addScaledVector(a, along * f);
}

/* ---------- Som (sintetizado) ---------- */
function setSound(on) {
  state.sound = on;
  try {
    if (on && !state.audio) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 1.2;
      const ng = ctx.createGain(); ng.gain.value = 0.12;
      const tone = ctx.createOscillator(); tone.type = 'sawtooth'; tone.frequency.value = 119; // passagem dos dentes: 3.581 rpm × 2 / 60
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      const tg = ctx.createGain(); tg.gain.value = 0.08;
      const master = ctx.createGain(); master.gain.value = 0;
      noise.connect(bp).connect(ng).connect(master);
      tone.connect(lp).connect(tg).connect(master);
      master.connect(ctx.destination);
      noise.start(); tone.start();
      state.audio = { ctx, master };
    }
    if (state.audio) state.audio.ctx.resume();
  } catch (e) { state.sound = false; }
}
function soundLevel(v) {
  if (!state.audio) return;
  const { ctx, master } = state.audio;
  master.gain.setTargetAtTime(state.sound ? v : 0, ctx.currentTime, 0.08);
}

/* ---------- Usinagem ---------- */
let lastExit = { A: null, B: null };
function resetCut() {
  toolX = -72; toolY = 0; clearChips(); lastExit = { A: null, B: null };
}
const EXIT_ANGLE = Math.asin(WP.edge / 8); // saída do engajamento, na borda da peça
function toothAngle(k) {
  const s = SEATS[k];
  return Math.atan2(s.c.z, s.c.x) - tool.rotation.y;
}
function cutStep(t, dt) {
  const T = t % 15;
  if (T < 12) { toolX = lerp(-72, 72, T / 12); toolY = 0; }
  else if (T < 13) { toolX = 72; toolY = 26 * ease(T - 12); }
  else if (T < 14.2) { toolX = lerp(72, -72, ease((T - 13) / 1.2)); toolY = 26; if (toolX < 0 && chips.some(c => c.mesh.visible)) clearChips(); }
  else { toolX = -72; toolY = 26 * (1 - ease((T - 14.2) / 0.8)); }
  tool.position.set(toolX, toolY, 0);
  machine.children[0].position.set(toolX, toolY, 0);
  strip.position.x = T < 13 || T >= 14.2 ? toolX : 400;
  if (T >= 13 && T < 14.2) strip.position.x = -200; // peça nova
  const omega = (3581 / 60) * TAU / state.slow;
  tool.rotation.y -= omega * dt;
  const engaged = toolY < 0.5 && toolX > WP.x0 - 7 && toolX < WP.x1;
  for (const k of ['A', 'B']) {
    const a = ((toothAngle(k) - EXIT_ANGLE) % TAU + TAU) % TAU;
    if (lastExit[k] !== null && a < lastExit[k] && engaged && dt > 0) {
      const n = 1 + (Math.random() < 0.4 ? 1 : 0);
      for (let i = 0; i < n; i++) {
        const p = V(toolX + 8 * Math.cos(EXIT_ANGLE), 1 + Math.random() * 7, WP.edge);
        const v = V(-Math.sin(EXIT_ANGLE), 0, Math.cos(EXIT_ANGLE)).multiplyScalar(260 + Math.random() * 200).add(V((Math.random() - 0.3) * 80, 120 + Math.random() * 180, (Math.random() - 0.5) * 60));
        spawnChip(p, v);
      }
    }
    lastExit[k] = a;
  }
  updateChips(dt);
  updateCoolant(dt, state.coolant && toolY < 20);
  soundLevel(engaged ? 0.5 : 0.12);
}

/* ---------- Laço principal ---------- */
const clock = new THREE.Clock();
let flashUntil = 0;
// Modo captura (#captura): o tempo avança por window.step(dt), quadro a quadro, para gravar vídeo.
const CAPTURE = location.hash === '#captura';
let simNow = 0;
function frame(fixedDt) {
  const dt = fixedDt ?? Math.min(clock.getDelta(), 0.05);
  simNow += dt;
  const now = simNow;
  const ch = CHAPTERS[state.ch];
  const id = ch.id;
  if (state.playing) state.t += dt;
  const t = state.t;

  machine.visible = id === 'cut';
  ground.position.y = id === 'cut' ? WP.bottom - 0.01 : -30;
  if (id !== 'cut') { tool.position.set(0, 0, 0); soundLevel(0); }

  let xray = 0;
  if (id === 'intro') {
    applyPose(explodedPose(0));
    tool.rotation.y = 0;
    const p = ease(seg(t, 3, 7));
    const az = lerp(0.45, 1.05, p) + t * 0.025, el = lerp(0.3, 0.2, p);
    orbit(V(0, lerp(9, 50, p), lerp(0, 0, p)), az, el, lerp(80, 250, p));
    xray = ease(seg(t, 9.5, 10.5)) * (1 - ease(seg(t, 13.5, 14.5)));
    const groups = [];
    if (t > 7 && t < 9.5 || t > 14.5) groups.push('intro', 'dims');
    if (t >= 9.5 && t <= 14.5) groups.push('xray', 'dims');
    if (t < 7) caption('Sandvik Coromant · i9 Ferramentas, distribuidor autorizado', 'Pastilhas trocáveis, rebaixo a 90°');
    else if (t < 9.5) caption('Dimensões do desenho técnico', 'Ø16 × 100 mm, até 9 mm de profundidade');
    else if (t < 14.5) caption('Por dentro', 'O fluido chega direto na aresta de corte');
    else caption('', '');
    showLabels(groups);
    dims.rotation.y = Math.atan2(camera.position.x, camera.position.z);
    if (t >= ch.dur) state.autoplay ? goTo(1, true) : (state.t = 7.2);
  } else if (id === 'cut') {
    applyPose(explodedPose(0));
    cutStep(t, state.playing ? dt : 0);
    orbit(V(toolX * 0.5 - 8, 3, -8), 0.34 + Math.sin(t * 0.2) * 0.08, 0.36, 150);
    showLabels([]);
    caption(`Aço inoxidável · câmera lenta 1:${state.slow}`, t < 12 ? 'Rebaixo com 9 mm de profundidade' : 'Próxima peça');
    if (t >= ch.dur && state.autoplay) goTo(2, true);
  } else if (id === 'explode') {
    // volta a ferramenta para a posição de referência sem pular
    tool.rotation.y = lerp(tool.rotation.y, Math.round(tool.rotation.y / TAU) * TAU, 1 - Math.exp(-dt * 4));
    const e = ease(seg(t, 0.4, 3));
    applyPose(explodedPose(e));
    chainView(SEATS.B.c.clone().addScaledVector(SEATS.B.a, 78), 330 - t * 3, 90, 10);
    showLabels(t > 2.8 ? ['parts'] : []);
    caption('Peças incluídas e acessórios', t < 3 ? 'Cada peça no seu lugar' : 'Parafuso, bit e chave de torque');
    if (t >= ch.dur && state.autoplay) goTo(3, true);
  } else if (id === 'assembly') {
    tool.rotation.y = lerp(tool.rotation.y, Math.round(tool.rotation.y / TAU) * TAU, 1 - Math.exp(-dt * 4));
    const pIns = 1 - ease(seg(t, 0.6, 3));
    const approach = 1 - ease(seg(t, 3, 4.2));
    const thread = 1 - seg(t, 4.2, 6.5);
    const scr = approach * 20 + (approach > 0 ? 6 : 6 * thread);
    const spin = -((6 - (approach > 0 ? 6 : 6 * thread)) / 0.45) * TAU - ease(seg(t, 9.2, 11.4)) * (Math.PI / 2);
    const wr = EXPLODED.wr * (1 - ease(seg(t, 6.5, 7.5))) + 40 * (1 - ease(seg(t, 5.5, 6.8)));
    const bitGap = EXPLODED.bit * (1 - ease(seg(t, 7.5, 9))) + 26 * ease(seg(t, 12.2, 14));
    const wrSpin = -ease(seg(t, 9.2, 11.4)) * (Math.PI / 2);
    applyPose({
      insA: EXPLODED.ins * pIns, insB: EXPLODED.ins * pIns, scrA: scr, scrB: scr, spinA: spin, spinB: spin,
      bit: bitGap, wr, wrSpin, tools: t > 5.5 && t < 14.6,
    });
    if (t > 11.4 && !state.flashed) { state.flashed = true; flashUntil = now + 1.3; }
    if (t < 11.4) state.flashed = false;
    const step = ASSEMBLY_STEPS.reduce((acc, [s], i) => (t >= s ? i : acc), 0);
    document.querySelectorAll('.steps li').forEach((li, i) => { li.classList.toggle('on', i === step); li.classList.toggle('done', i < step); });
    caption(`Passo ${String(step + 1).padStart(2, '0')}`, ASSEMBLY_STEPS[step][1]);
    const far = ease(seg(t, 6, 7.5)) * (1 - ease(seg(t, 13, 15)));
    const out = ease(seg(t, 14.5, 17));
    const near = SEATS.B.c.clone().addScaledVector(SEATS.B.a, 5);
    const mid = SEATS.B.c.clone().addScaledVector(SEATS.B.a, 45);
    const c = near.clone().lerp(mid, far).lerp(V(0, 40, 0), out);
    chainView(c, lerp(lerp(70, 210, far), 240, out), lerp(lerp(26, 60, far), 70, out), lerp(lerp(40, 20, far), 0, out));
    showLabels([]);
    if (t >= ch.dur) state.autoplay ? goTo(4, true) : (state.t = 0);
  } else {
    if (state.spin) tool.rotation.y -= dt * 0.8;
    applyPose(explodedPose(state.explode));
    orbit(V(0, 45, 20 * state.explode), 0.9, 0.22, 260 + state.explode * 80);
    xray = state.xray ? 1 : 0;
    showLabels(state.explode > 0.6 ? ['parts'] : []);
    caption('', '');
  }
  $('flash').hidden = !(now < flashUntil);
  $('flash').textContent = 'Clique · torque atingido';

  // raio-X
  MAT.body.transparent = xray > 0.01;
  MAT.body.opacity = 1 - xray * 0.78;
  MAT.body.depthWrite = xray < 0.5;
  MAT.coolant.opacity = xray * 0.95;

  // progresso na linha do tempo
  chapEl.querySelectorAll('.chap .bar b').forEach((b, i) => {
    b.style.width = i < state.ch ? '100%' : i === state.ch && ch.dur ? `${clamp(t / ch.dur) * 100}%` : '0%';
  });

  if (!state.userCam) {
    const k = 1 - Math.exp(-dt * (id === 'cut' ? 5 : 2.6));
    camera.position.lerp(desired.pos, k);
    controls.target.lerp(desired.target, k);
  }
  controls.update();
  keyLight.target.position.copy(controls.target);
  keyLight.target.updateMatrixWorld();
  renderer.render(scene, camera);
  updateLabels();
  if (!CAPTURE) requestAnimationFrame(() => frame());
}

function pick(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(PICKABLE.map(([, g]) => g).filter(g => g.visible !== false), true);
  if (!hits.length) return null;
  let o = hits[0].object;
  while (o) { const f = PICKABLE.find(([, g]) => g === o); if (f) return f[0]; o = o.parent; }
  return null;
}
let down = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 6 || CHAPTERS[state.ch].id !== 'explore') return;
  const k = pick(e);
  const [title, text] = k ? PART_INFO[k] : ['Explore a fresa', 'Arraste para girar, role para aproximar e clique numa peça para ver o que ela é.'];
  $('exTitle').textContent = title; $('exText').textContent = text;
});
canvas.addEventListener('pointermove', e => {
  if (CHAPTERS[state.ch].id !== 'explore' || e.pointerType !== 'mouse' || down) { $('tip').hidden = true; return; }
  const k = pick(e);
  canvas.style.cursor = k ? 'pointer' : 'grab';
  if (k) { $('tip').textContent = PART_INFO[k][0]; $('tip').style.left = e.clientX + 'px'; $('tip').style.top = e.clientY + 'px'; }
  $('tip').hidden = !k;
});

// atalho para testes: window.seek(capítulo, segundos)
window.seek = (i, t) => { goTo(i, false); state.t = t; state.userCam = false; };
goTo(0, true);
orbit(V(0, 9, 0), 0.45, 0.3, 80);
camera.position.copy(desired.pos); controls.target.copy(desired.target);
resize();
if (CAPTURE) { window.step = dt => frame(dt); document.documentElement.classList.add('capture'); } else frame();
</script>
