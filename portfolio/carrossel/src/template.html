<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carrossel de Ferramentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Visual único e deliberado: bancada grafite escura, destaque em azul técnico (mesma linha do portfólio). */
  :root {
    color-scheme: dark;
    --paper: #10161d;
    --paper-2: #0a0e13;
    --panel: rgba(22, 29, 38, 0.9);
    --panel-solid: #161d26;
    --ink: #e8edf2;
    --ink-2: #b9c4ce;
    --muted: #8b98a5;
    --line: rgba(185, 205, 225, 0.14);
    --line-strong: rgba(185, 205, 225, 0.3);
    --accent: #5cb8ff;
    --accent-ink: #9fd4ff;
    --on-accent: #07121c;
    --in: #5cb8ff;
    --out: #d59a5c;
    --core: #8b98a5;
    --warn: #f0a24a;
    --ok: #6fd39a;
    --display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --body: "Barlow", "Helvetica Neue", Arial, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --gutter: 16px;
    --tb: 60px;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background:
      linear-gradient(rgba(185,205,225,.04) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, rgba(185,205,225,.04) 1px, transparent 1px) 0 0 / 24px 24px,
      radial-gradient(120% 90% at 50% 40%, #1e2833 0%, var(--paper) 55%, var(--paper-2) 100%) fixed,
      var(--paper);
    color: var(--ink); font: 400 14px/1.5 var(--body); -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  .brand { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); left: calc(var(--gutter) + 4px); pointer-events: none; }
  .eyebrow { margin: 0; font: 500 11px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .brand h1 { margin: 2px 0 0; font: 700 44px/0.95 var(--display); letter-spacing: .01em; text-transform: uppercase; }
  .brand h1 span { color: var(--accent); }
  .brand .sub { margin: 2px 0 0; font-size: 15px; color: var(--ink-2); }
  #credit { position: absolute; margin: 0; pointer-events: none; font: 500 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    left: calc(var(--gutter) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tb) + 26px); }
  #credit b { color: var(--ink); font-weight: 500; }

  .box { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #panel { right: var(--gutter); top: calc(env(safe-area-inset-top, 0px) + 16px); width: 340px;
    max-height: calc(100% - 16px - var(--tb) - 40px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; padding: 15px 17px 17px; }
  #panel h2 { margin: 4px 0 8px; font: 700 28px/1 var(--display); text-transform: uppercase; text-wrap: balance; }
  #panel p.text { margin: 0 0 12px; color: var(--ink-2); text-wrap: pretty; }
  #panel p.text b { color: var(--ink); font-weight: 600; }
  .facts { margin: 0; display: grid; grid-template-columns: auto 1fr; border-top: 1px solid var(--line); }
  .facts dt, .facts dd { margin: 0; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .facts dt { font: 500 11px/1.5 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding-right: 12px; }
  .facts dd { text-align: right; font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 3px; background: rgba(255,255,255,.04); color: var(--ink); font: 500 13px/1 var(--body); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover { background: var(--accent-ink); }
  .btn[aria-pressed="true"] { background: rgba(92,184,255,.18); border-color: var(--accent); color: var(--accent-ink); }
  .btn:focus-visible, .chap:focus-visible, #play:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #data { left: var(--gutter); top: calc(env(safe-area-inset-top, 0px) + 116px); width: 330px; padding: 12px 14px 10px; }
  #data .stock { display: flex; justify-content: space-between; align-items: baseline; margin: 8px 0 6px; }
  #data .stock span { font: 500 12px/1.3 var(--mono); color: var(--ink-2); }
  #data .stock b { font: 700 24px/1 var(--display); font-variant-numeric: tabular-nums; }
  .meter { position: relative; height: 8px; border-radius: 2px; background: rgba(185,205,225,.12); margin-bottom: 10px; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--accent); transition: width .5s; }
  .meter i.low { background: var(--warn); }
  .meter em { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink-2); }
  #data table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #data td { padding: 5px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  #data td:first-child { font: 500 11px/1.5 var(--mono); color: var(--muted); padding-left: 0; white-space: nowrap; }
  #data td:last-child { text-align: right; }
  #data tr.new td { color: var(--accent-ink); }
  #data tr.alert td { color: var(--warn); }
  #data tr.ok td { color: var(--ok); }

  #panel .note { margin: 12px 0 0; font-size: 11.5px; line-height: 1.45; color: var(--muted); }
  #data .rows { display: grid; grid-template-columns: auto 1fr; gap: 0 12px; margin: 8px 0 4px; font-size: 12.5px; }
  #data .rows span { color: var(--muted); font: 500 11px/1.9 var(--mono); text-transform: uppercase; letter-spacing: .04em; }
  #data .rows b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.75; }
  #data .rows b.ok { color: var(--ok); } #data .rows b.warn { color: var(--warn); } #data .rows b.run { color: var(--accent-ink); }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  #leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #leaders line { stroke: var(--accent); stroke-width: 1; transition: opacity .3s; }
  .lbl { position: absolute; left: 0; top: 0; padding: 4px 8px; background: var(--panel-solid); border: 1px solid var(--line-strong); border-radius: 3px;
    font: 500 12px/1.2 var(--body); white-space: nowrap; opacity: 0; transition: opacity .3s; }
  .lbl.show { opacity: 1; }

  #timeline { position: absolute; left: var(--gutter); right: var(--gutter); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; align-items: center; gap: 8px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #play { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 3px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
  #play svg { width: 18px; height: 18px; fill: currentColor; }
  #chapters { flex: 1; min-width: 0; list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
  .chap { width: 100%; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 6px; padding: 5px 7px 6px; border: 0; border-radius: 3px; background: transparent; color: var(--ink-2); font: 500 12.5px/1.2 var(--body); text-align: left; cursor: pointer; }
  .chap:hover { background: rgba(185,205,225,.08); }
  .chap .n { font: 500 10.5px/1 var(--mono); color: var(--muted); }
  .chap .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chap .bar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: rgba(185,205,225,.14); overflow: hidden; }
  .chap .bar b { display: block; height: 100%; width: 0; background: var(--accent); }
  .chap.on { background: rgba(92,184,255,.12); color: var(--ink); }
  .chap.on .n { color: var(--accent-ink); }
  #caption { display: none; }

  @media (max-width: 1180px) { #panel { width: 300px; } #data { width: 290px; } .brand h1 { font-size: 36px; } .chap .nm { font-size: 11.5px; } }
  @media (max-width: 860px) {
    .brand h1 { font-size: 28px; }
    .brand .sub { font-size: 13px; }
    .brand .eyebrow { display: none; }
    #credit { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 70px); font-size: 9px; }
    #labels, #leaders { display: none; }
    #panel { top: auto; left: var(--gutter); right: var(--gutter); width: auto; max-height: 34%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tb) + 24px); padding: 11px 13px 13px; }
    #panel h2 { font-size: 21px; margin: 2px 0 6px; }
    #panel p.text { font-size: 13px; margin-bottom: 8px; }
    .facts { display: none; }
    #data { top: calc(env(safe-area-inset-top, 0px) + 92px); left: var(--gutter); right: var(--gutter); width: auto; padding: 8px 10px 6px; }
    #data table, #data .stock, #data .meter, #panel .note { display: none; }
    #data .rows { grid-template-columns: auto 1fr auto 1fr; font-size: 11.5px; margin: 4px 0 0; }
    #data .rows span { font-size: 9.5px; }
    #chapters .nm { display: none; }
    .chap { grid-template-columns: 1fr; justify-items: center; padding: 6px 2px; }
    #caption { display: block; flex: none; max-width: 34%; font: 600 13px/1.2 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="Modelo 3D de um dispenser rotativo de ferramentas com 75 posições. Arraste para girar e role para aproximar."></canvas>
  <div id="loading">Montando o carrossel…</div>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="labels" aria-hidden="true"></div>

  <header class="brand">
    <p class="eyebrow">Vista Explodida · projeto de demonstração</p>
    <h1>Carrossel <span>75 posições</span></h1>
    <p class="sub">Dispenser rotativo de ferramentas · como funciona por dentro</p>
  </header>
  <p id="credit">Vista Explodida · por <b>Marcos Felipe</b></p>

  <aside id="data" class="box" aria-live="polite" hidden></aside>
  <aside id="panel" class="box" aria-live="polite"></aside>

  <nav id="timeline" aria-label="Etapas">
    <button id="play" type="button" aria-label="Pausar"></button>
    <ol id="chapters"></ol>
    <span id="caption"></span>
  </nav>
</div>
<script>/*APP*/</script>
</body>
</html>
