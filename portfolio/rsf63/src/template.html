<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redutor RSF-63</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Visual único e deliberado: bancada grafite escura, destaque em azul técnico. */
  :root {
    color-scheme: dark;
    --paper: #10161d;
    --paper-2: #0a0e13;
    --panel: rgba(22, 29, 38, 0.9);
    --panel-solid: #161d26;
    --ink: #e8edf2;
    --ink-2: #b9c4ce;
    --muted: #8b98a5;
    --line: rgba(185, 205, 225, 0.14);
    --line-strong: rgba(185, 205, 225, 0.3);
    --accent: #5cb8ff;
    --accent-ink: #9fd4ff;
    --on-accent: #07121c;
    --in: #5cb8ff;
    --out: #d59a5c;
    --core: #8b98a5;
    --display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --body: "Barlow", "Helvetica Neue", Arial, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --gutter: 16px;
    --tb: 60px;
  }
  [hidden] { display: none !important; }
  /* modo vitrine: só o modelo, fundo transparente, sem interação */
  .vitrine body { background: transparent; }
  .vitrine .brand, .vitrine #credit, .vitrine #seq, .vitrine #info, .vitrine #readout, .vitrine #cutNote, .vitrine #toolbar, .vitrine #tip, .vitrine #toast, .vitrine #dims, .vitrine #loading { display: none !important; }
  .vitrine #c { pointer-events: none; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background:
      linear-gradient(rgba(185,205,225,.04) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, rgba(185,205,225,.04) 1px, transparent 1px) 0 0 / 24px 24px,
      radial-gradient(120% 90% at 50% 40%, #1e2833 0%, var(--paper) 55%, var(--paper-2) 100%) fixed,
      var(--paper);
    color: var(--ink);
    font: 400 14px/1.5 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  .brand { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); left: calc(var(--gutter) + 4px); pointer-events: none; }
  .eyebrow { margin: 0; font: 500 11px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .brand h1 { margin: 2px 0 0; font: 700 44px/0.95 var(--display); letter-spacing: .01em; text-transform: uppercase; }
  .brand h1 span { color: var(--accent); }
  .brand .sub { margin: 2px 0 0; font-size: 15px; color: var(--ink-2); }
  #credit { position: absolute; margin: 0; pointer-events: none; font: 500 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    right: calc(var(--gutter) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tb) + 26px); }
  #credit b { color: var(--ink); font-weight: 500; }

  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #seq { left: var(--gutter); top: calc(env(safe-area-inset-top, 0px) + 112px); width: 262px;
    max-height: calc(100% - 112px - var(--tb) - 40px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 11px 14px 9px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { margin: 0; font: 700 15px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; }
  #count { font: 500 11px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  #list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; display: grid; gap: 1px; }
  .step { width: 100%; display: grid; grid-template-columns: 22px 8px 1fr auto; align-items: center; gap: 8px; padding: 5px 8px; border: 0; border-radius: 3px; background: transparent; color: var(--ink); font: 400 13px/1.25 var(--body); text-align: left; cursor: pointer; }
  .step:hover { background: rgba(185,205,225,.08); }
  .step:focus-visible, .btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .step .n { font: 500 11px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--core); display: inline-block; }
  .dot.in { background: var(--in); } .dot.out { background: var(--out); }
  .step .st { font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .step.is-out .nm { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(185,205,225,.35); }
  .step.is-next .st { color: var(--accent-ink); }
  .step.is-sel { background: rgba(92,184,255,.14); box-shadow: inset 2px 0 0 var(--accent); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 14px 10px; border-top: 1px solid var(--line); font: 400 11px/1.3 var(--mono); color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  #info { right: var(--gutter); top: calc(env(safe-area-inset-top, 0px) + 16px); width: 318px;
    max-height: calc(100% - 16px - var(--tb) - 58px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; padding: 15px 17px 17px; }
  #info h2 { margin: 4px 0 8px; font: 700 28px/1 var(--display); text-transform: uppercase; text-wrap: balance; }
  #info .kind { display: flex; align-items: center; gap: 8px; }
  #info p.text { margin: 0 0 12px; color: var(--ink-2); text-wrap: pretty; }
  .facts { margin: 0 0 12px; display: grid; grid-template-columns: auto 1fr; border-top: 1px solid var(--line); }
  .facts dt, .facts dd { margin: 0; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .facts dt { font: 500 11px/1.5 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding-right: 12px; }
  .facts dd { text-align: right; font-variant-numeric: tabular-nums; }
  .facts dd b { font: 700 18px/1 var(--display); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .note { margin: 12px 0 0; font-size: 11.5px; line-height: 1.45; color: var(--muted); }

  #toolbar { position: absolute; left: var(--gutter); right: var(--gutter); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; padding: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .grp { display: inline-flex; align-items: center; gap: 6px; }
  .grp > small { font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 3px; background: rgba(255,255,255,.04); color: var(--ink); font: 500 13px/1 var(--body); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover { background: #e4623a; }
  .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 3px; overflow: hidden; }
  .seg button { min-height: 32px; padding: 0 10px; border: 0; border-left: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--ink); font: 500 12.5px/1 var(--body); cursor: pointer; white-space: nowrap; }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .slider { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .slider input { width: 110px; accent-color: var(--accent); }
  kbd { font: 500 10px/1 var(--mono); padding: 2px 4px; border: 1px solid currentColor; border-radius: 3px; opacity: .55; }
  #bParts { display: none; }

  #readout { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px); transform: translateX(-50%);
    display: grid; grid-template-columns: repeat(3, auto); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
  #readout div { padding: 7px 14px; border-left: 1px solid var(--line); }
  #readout div:first-child { border-left: 0; }
  #readout small { display: block; font: 500 10px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  #readout b { font: 700 22px/1.1 var(--display); font-variant-numeric: tabular-nums; }
  #readout b i { font-style: normal; font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 3px; font-family: var(--body); }
  #cutNote { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 84px);
    max-width: min(560px, calc(100% - 2 * var(--gutter))); margin: 0; padding: 7px 12px; background: var(--panel-solid); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 3px; font-size: 13px; }
  #cutNote:empty { display: none; }

  #dims { position: absolute; inset: 0; pointer-events: none; }
  .dim { position: absolute; left: 0; top: 0; padding: 1px 4px; background: var(--paper); font: 500 12px/1.2 var(--mono); color: var(--ink); white-space: nowrap; }
  #tip { position: absolute; pointer-events: none; padding: 5px 9px; background: var(--ink); color: var(--paper); border-radius: 3px; font: 500 12px/1.2 var(--body); white-space: nowrap; transform: translate(14px, 14px); }
  #toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tb) + 70px); padding: 8px 14px; background: var(--ink); color: var(--paper); border-radius: 3px; font-size: 13px; max-width: calc(100% - 32px); text-align: center; }

  @media (max-width: 1180px) { #seq { width: 230px; } #info { width: 286px; } .brand h1 { font-size: 36px; } kbd { display: none; } }
  @media (max-width: 860px) {
    .brand h1 { font-size: 30px; }
    .brand .sub { font-size: 13px; }
    #bParts { display: inline-flex; }
    #seq { display: none; top: calc(env(safe-area-inset-top, 0px) + 96px); right: var(--gutter); width: auto; z-index: 4;
      max-height: calc(100% - 96px - var(--tb) - 40px); }
    #seq.open { display: flex; }
    #info { top: auto; left: var(--gutter); right: var(--gutter); width: auto; max-height: 30%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tb) + 24px); padding: 11px 13px 13px; }
    #info h2 { font-size: 22px; }
    #info .note { display: none; }
    #toolbar { gap: 6px; padding: 6px; }
    .grp > small { display: none; }
    .slider input { width: 80px; }
    #readout, #cutNote, .brand .eyebrow { display: none; }
    #credit { right: auto; left: calc(var(--gutter) + 4px); bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 74px); font-size: 9px; }
    #toolbar { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
    #toolbar::-webkit-scrollbar { display: none; }
    .grp, .slider { flex: none; }
    #info { max-height: 27%; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="Modelo 3D do redutor coroa e rosca sem fim RSF-63. Arraste para girar, role para aproximar, clique numa peça para ver o que ela é."></canvas>
  <div id="loading">Montando o redutor…</div>
  <div id="dims" aria-hidden="true"></div>

  <header class="brand">
    <p class="eyebrow">Vista Explodida · projeto de demonstração</p>
    <h1>RSF <span>63</span></h1>
    <p class="sub">Redutor i = 30:1 · carcaça de alumínio</p>
  </header>
  <p id="credit">Vista Explodida · por <b>Marcos Felipe</b></p>

  <aside id="seq" class="panel" aria-label="Sequência de desmontagem">
    <div class="panel-head"><h2>Desmontagem</h2><span id="count"></span></div>
    <ol id="list"></ol>
    <div class="legend"><span><i class="dot in"></i>Entrada (sem-fim)</span><span><i class="dot out"></i>Saída (coroa)</span><span><i class="dot"></i>Carcaça</span></div>
  </aside>

  <aside id="info" class="panel" aria-live="polite"></aside>

  <div id="readout">
    <div><small>Entrada</small><b>1.700<i>rpm</i></b></div>
    <div><small>Saída</small><b>56,7<i>rpm</i></b></div>
    <div><small>Torque</small><b>140<i>Nm</i></b></div>
  </div>
  <p id="cutNote" aria-live="polite"></p>

  <nav id="toolbar" aria-label="Controles">
    <div class="grp">
      <button class="btn" id="bParts" type="button" aria-pressed="false">Peças</button>
      <button class="btn primary" id="bNext" type="button">Desmontar próxima <kbd>D</kbd></button>
      <button class="btn" id="bUndo" type="button">Recolocar <kbd>R</kbd></button>
      <button class="btn" id="bAll" type="button">Montar tudo</button>
    </div>
    <label class="slider" for="explode">Explodida <input id="explode" type="range" min="0" max="100" value="0"></label>
    <div class="grp"><small>Vista</small>
      <div class="seg" role="group" aria-label="Vista">
        <button type="button" data-view="3d">3D</button><button type="button" data-view="front">Frontal</button><button type="button" data-view="side">Lateral</button><button type="button" data-view="top">Superior</button>
      </div>
    </div>
    <div class="grp"><small>Corte</small>
      <div class="seg" role="group" aria-label="Corte">
        <button type="button" data-cut="none">Sem</button><button type="button" data-cut="aa">A-A</button><button type="button" data-cut="bb">B-B</button><button type="button" data-cut="q">¼</button>
      </div>
    </div>
    <button class="btn" id="bRun" type="button" aria-pressed="true">Funcionando</button>
  </nav>

  <div id="tip" hidden></div>
  <div id="toast" hidden role="status"></div>
</div>
<script>/*APP*/</script>
</body>
</html>
